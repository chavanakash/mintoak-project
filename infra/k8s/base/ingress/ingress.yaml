apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mintoak
  namespace: mintoak
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /api/merchants/foo -> merchant-service: /merchants/foo (strips only the leading /api)
          - path: /api/(merchants.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: merchant-service, port: { number: 3001 } }
          - path: /api/(transactions.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: transaction-service, port: { number: 3002 } }
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: frontend, port: { number: 80 } }
