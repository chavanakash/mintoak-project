# Plaintext here only because this is a local learning cluster with no real
# data. In a real cluster this would be sealed-secrets / external-secrets /
# a vault injector — never a raw Secret committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mintoak
type: Opaque
stringData:
  POSTGRES_DB: mintoak
  POSTGRES_USER: mintoak
  POSTGRES_PASSWORD: mintoak
