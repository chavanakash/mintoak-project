apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: mintoak
spec:
  replicas: 2
  selector:
    matchLabels: { app: merchant-service }
  template:
    metadata:
      labels: { app: merchant-service }
    spec:
      containers:
        - name: merchant-service
          image: localhost:5001/merchant-service:latest
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: mintoak
spec:
  selector: { app: merchant-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: merchant-service
  namespace: mintoak
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: merchant-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
