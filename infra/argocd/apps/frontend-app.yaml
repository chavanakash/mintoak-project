apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mintoak-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/mintoak-project.git # <-- change me
    targetRevision: main
    path: infra/k8s/base/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: mintoak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
