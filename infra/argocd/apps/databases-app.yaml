apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mintoak-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # datastores come up before anything that depends on them
spec:
  project: default
  source:
    repoURL: https://github.com/chavanakash/mintoak-project.git # <-- change me
    targetRevision: main
    path: infra/k8s/base/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: mintoak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
