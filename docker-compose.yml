services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mintoak
      POSTGRES_USER: mintoak
      POSTGRES_PASSWORD: mintoak
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintoak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      # kafka-topics.sh is a JVM CLI with ~10s of its own startup overhead --
      # too slow to use as the check itself. A plain TCP probe on the broker
      # port is enough here: it gates dependents until Kafka is at least
      # accepting connections, and restart:on-failure on the consumers
      # absorbs the remaining topic-auto-create race.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      retries: 20

  merchant-service:
    build: ./backend/merchant-service
    restart: on-failure
    ports: ["3001:3001"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mintoak
      DB_PASSWORD: mintoak
      DB_NAME: mintoak
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build: ./backend/transaction-service
    restart: on-failure
    ports: ["3002:3002"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mintoak
      DB_PASSWORD: mintoak
      DB_NAME: mintoak
      KAFKA_BROKER: kafka:9092
      PORT: "3002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./backend/notification-service
    restart: on-failure
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongo:27017/mintoak_analytics
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MERCHANT_API: http://localhost:3001/merchants
        VITE_TRANSACTION_API: http://localhost:3002/transactions
    restart: on-failure
    ports: ["5173:80"]
    depends_on:
      - merchant-service
      - transaction-service

volumes:
  postgres_data:
  mongo_data:
